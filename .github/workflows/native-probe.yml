name: Native environment probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm run check
        timeout-minutes: 1
      - run: npm test
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe-${{ matrix.os }}-${{ github.sha }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 7
